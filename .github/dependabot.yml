version: 2
updates:
  # Google Adapters (admob + gam)
  # Note: Dependabot cannot group updates from different directories
  # These will create separate PRs, but they often need to be updated together
  - package-ecosystem: "gradle"
    directory: "/adapter/admob"
    target-branch: "develop"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "da2gl"
      - "copilot"
    commit-message:
      prefix: "chore(admob)"
      include: "scope"
    labels:
      - "dependencies"
      - "google-adapter"

  - package-ecosystem: "gradle"
