version: 2

registries:
  google-maven:
    type: maven-repository
    url: https://maven.google.com

  bidon-public:
    type: maven-repository
    url: https://artifactory.bidon.org/bidon

  # Dependabot does not read `dependencyResolutionManagement` from settings.gradle.kts.
  # Every non-default repository declared there must be duplicated here, otherwise
  # Dependabot resolves against Maven Central only and silently reports "no update possible".
  bidmachine:
    type: maven-repository
    url: https://artifactory.bidmachine.io/bidmachine

  # Maven Central hosts a stale mirror of com.chartboost:chartboost-sdk (9.2.1),
  # current releases are published to this repository only.
  chartboost-ads:
    type: maven-repository
    url: https://cboost.jfrog.io/artifactory/chartboost-ads

# Since 2026-07-14 Dependabot applies a default 3 day cooldown to version updates,
# so a release is not proposed until 3 days after it was published to the registry.
# Ad network SDKs ship hotfixes that we want to pick up on the next scheduled run,
# so every block below opts out with `cooldown.exclude: ["*"]` — the exclude list is
# matched with File.fnmatch, and `*` matches every dependency name, which disables the
# cooldown filter entirely. `default-days: 0` is not used: the dependabot-2.0 JSON
# schema constrains that field to 1..90 and an out-of-range value risks rejecting the
# whole configuration.
#
# Trade-off: the cooldown exists to let a compromised or broken release be pulled
# before it reaches consumers. Opting out means such a release can land in a PR within
# hours, so adapter bumps must not be merged without CI and review.
updates:
  # Google Adapters (admob + gam)
  # Note: Dependabot cannot group updates from different directories
  # These will create separate PRs, but they often need to be updated together
  - package-ecosystem: "gradle"
    directory: "/adapter/admob"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    cooldown:
      exclude:
        - "*"
    registries:
      - google-maven
      - bidon-public
    reviewers:
      - "bidon-io/bidon-android"
    commit-message:
      prefix: "⬆️"
    labels:
      - "dependencies"
      - "google-adapter"

  - package-ecosystem: "gradle"
    directory: "/adapter/gam"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "wednesday"
