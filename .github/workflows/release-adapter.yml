name: Release Adapter

on:
  workflow_call:
    inputs:
      adapter:
        description: 'Adapter name'
        required: true
        type: string
      repository:
        description: 'Repository'
        required: true
        type: string
    secrets:
      ARTIFACTORY_USER:
        required: false
      ARTIFACTORY_PASSWORD:
        required: false
      FALLBACK_ARTIFACTORY_URL:
        required: true
      FALLBACK_ARTIFACTORY_USER:
        required: true
      FALLBACK_ARTIFACTORY_PASSWORD:
        required: true
      SLACK_WEBHOOK:
        required: true

  workflow_dispatch:
    inputs:
      adapter:
        description: 'Adapter'
        required: true
        type: choice
        options: [admob, amazon, applovin, bidmachine, bigoads, chartboost, dtexchange, gam, inmobi, ironsource, meta, mintegral, mobilefuse, moloco, startio, taurusx, unityads, vkads, vungle, yandex, zmaticoo]
      repository:
        description: 'Repository'
        required: true
        default: bidon-private
        type: choice
        options: [bidon-private, bidon]

jobs:
  publish:
    name: Publish ${{ inputs.adapter }} to ${{ inputs.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle and Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get adapter version
        id: version
        run: |
          VERSION=$(grep 'val adapterSdkVersion = ' adapter/${{ inputs.adapter }}/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "❌ Failed to extract adapter version for ${{ inputs.adapter }}. Exiting."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Adapter: ${{ inputs.adapter }}"
          echo "🏷️  Version: $VERSION"
          echo "🎯 Repository: ${{ inputs.repository }}"

      - name: Publish to Artifactory (primary)
        run: |
          echo "🚀 Publishing ${{ inputs.adapter }} to ${{ inputs.repository }} (primary)..."
          ./gradlew :adapter:${{ inputs.adapter }}:publishAllPublicationsToBidonRepository --no-daemon
        env:
          ORG_GRADLE_PROJECT_repo: ${{ inputs.repository }}
          ORG_GRADLE_PROJECT_uname: ${{ secrets.ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_upassword: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Publish to Artifactory (fallback)
        run: |
          echo "🚀 Publishing ${{ inputs.adapter }} to ${{ inputs.repository }} (fallback)..."
          ./gradlew :adapter:${{ inputs.adapter }}:publishAllPublicationsToBidonRepository --no-daemon
        env:
          ORG_GRADLE_PROJECT_repo: ${{ inputs.repository }}
          ORG_GRADLE_PROJECT_repoUrl: ${{ secrets.FALLBACK_ARTIFACTORY_URL }}
          ORG_GRADLE_PROJECT_uname: ${{ secrets.FALLBACK_ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_upassword: ${{ secrets.FALLBACK_ARTIFACTORY_PASSWORD }}

      - name: Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://avatars.githubusercontent.com/u/120632208?s=200&v=4
          SLACK_MESSAGE: |
            📦 Adapter: ${{ inputs.adapter }}
            🏷️  Version: ${{ steps.version.outputs.version }}
            🎯 Repository: ${{ inputs.repository }}
            📌 Status: ${{ job.status }}
            🔗 Commit: ${{ github.sha }}
          SLACK_USERNAME: bidon-publish-bot
          SLACK_TITLE: "Adapter Published"
          MSG_MINIMAL: actions url
