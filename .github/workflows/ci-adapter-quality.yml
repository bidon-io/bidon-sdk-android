name: CI Adapter Quality

on:
  pull_request:
    types: [opened, synchronize]
    paths: ['adapter/**']

  workflow_dispatch:

jobs:
  _detect-changes:
    runs-on: ubuntu-latest
    outputs:
      adapters: ${{ steps.matrix.outputs.adapters }}
      adapters_for_deprecation: ${{ steps.matrix.outputs.adapters_for_deprecation }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Discover available adapters
        id: discover
        run: |
          echo "🔍 Discovering available adapters..."

          # Find all adapter directories (excluding build directories)
          available_adapters=""
          for dir in adapter/*/; do
            if [[ -d "$dir" ]]; then
              adapter_name=$(basename "$dir")
              # Skip build and other non-adapter directories
              if [[ "$adapter_name" != "build" ]] && [[ -f "$dir/build.gradle.kts" ]]; then
                if [[ -n "$available_adapters" ]]; then
                  available_adapters="$available_adapters $adapter_name"
                else
                  available_adapters="$adapter_name"
                fi
              fi
            fi
          done

          # Sort adapters for consistent output
          sorted_adapters=$(echo "$available_adapters" | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')

          # Count adapters
          adapter_count=$(echo "$sorted_adapters" | wc -w)
          echo "📦 Found $adapter_count adapters: $sorted_adapters"

          # Create JSON array for available adapters
          # Convert space-separated string to proper JSON array
          echo "$sorted_adapters" | tr ' ' '\n' > /tmp/adapters_list.txt
          json_array=$(jq -R -s -c 'split("\n")[:-1]' /tmp/adapters_list.txt)
          rm -f /tmp/adapters_list.txt

          echo "available_adapters=$json_array" >> $GITHUB_OUTPUT

      - name: Detect changed adapters
        uses: dorny/paths-filter@v2
        id: changes
        with:
          list-files: json
          filters: |
            any_adapter:
              - 'adapter/**'

      - name: Generate adapter matrix
        id: matrix
        run: |
          echo "🔍 Detecting changed adapters dynamically..."

          # Check if any adapter files changed
          if [[ "${{ steps.changes.outputs.any_adapter }}" != "true" ]]; then
            echo "📭 No adapter files changed"
            echo "adapters=[]" >> $GITHUB_OUTPUT
            echo "adapters_for_deprecation=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get list of available adapters
          available_adapters='${{ steps.discover.outputs.available_adapters }}'
          echo "📋 Available adapters: $available_adapters"

          # Get list of changed files
          changed_files='${{ steps.changes.outputs.any_adapter_files }}'
          echo "📝 Changed files: $changed_files"

          # Find which adapters have changes
          changed_adapters=""
          echo "$available_adapters" | jq -r '.[]' | while read -r adapter; do
            # Check if any changed file belongs to this adapter
            if echo "$changed_files" | jq -r '.[]' | grep -q "^adapter/$adapter/"; then
              echo "✅ Adapter '$adapter' has changes"
              echo "$adapter" >> /tmp/changed_adapters.txt
            fi
          done

          # Read changed adapters from temp file (to handle subshell issue)
          if [[ -f /tmp/changed_adapters.txt ]]; then
            changed_adapters=$(cat /tmp/changed_adapters.txt | tr '\n' ' ' | sed 's/ $//')
            rm -f /tmp/changed_adapters.txt
          fi

          if [[ -z "$changed_adapters" ]]; then
            echo "📭 No specific adapters changed (possibly only shared files)"
            echo "adapters=[]" >> $GITHUB_OUTPUT
            echo "adapters_for_deprecation=[]" >> $GITHUB_OUTPUT
          else
            # Sort adapters for consistent output
            sorted_changed=$(echo "$changed_adapters" | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')

            # Count changed adapters
            adapter_count=$(echo "$sorted_changed" | wc -w)

            # Create JSON array
            # Convert space-separated string to proper JSON array
            echo "$sorted_changed" | tr ' ' '\n' > /tmp/changed_adapters_list.txt
            json_array=$(jq -R -s -c 'split("\n")[:-1]' /tmp/changed_adapters_list.txt)
            rm -f /tmp/changed_adapters_list.txt

            echo "adapters=$json_array" >> $GITHUB_OUTPUT
            echo "📦 Changed adapters ($adapter_count): $sorted_changed"

            # Filter out adapters from deprecated skip list (repository variable)
            # Set DEPRECATED_SKIP_ADAPTERS in Settings → Variables (comma-separated, e.g. "applovin,inmobi")
            SKIP_VAR="${{ vars.DEPRECATED_SKIP_ADAPTERS }}"
            if [[ -n "$SKIP_VAR" ]]; then
              skip_json=$(echo "$SKIP_VAR" | tr ',' '\n' | jq -R -s -c 'split("\n")[:-1]')
              filtered=$(echo "$json_array" | jq -c --argjson skip "$skip_json" '[.[] | select(. as $a | $skip | index($a) | not)]')
              skipped=$(echo "$json_array" | jq -c --argjson skip "$skip_json" '[.[] | select(. as $a | $skip | index($a))]')
              echo "adapters_for_deprecation=$filtered" >> $GITHUB_OUTPUT
              echo "skipped_adapters=$skipped" >> $GITHUB_OUTPUT
              if [[ "$skipped" != "[]" ]]; then
                echo "⏭️ Deprecated check skipped for: $(echo "$skipped" | jq -r 'join(", ")')"
              fi
            else
              echo "adapters_for_deprecation=$json_array" >> $GITHUB_OUTPUT
              echo "skipped_adapters=[]" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Job Summary
        if: always()
        env:
          ADAPTERS: ${{ steps.matrix.outputs.adapters }}
          SKIPPED: ${{ steps.matrix.outputs.skipped_adapters }}
        run: |
          echo "## Adapter Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$ADAPTERS" == "[]" ]] || [[ -z "$ADAPTERS" ]]; then
            echo ":information_source: No adapter changes detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Changed adapters:** $(echo "$ADAPTERS" | jq -r 'join(", ")')" >> $GITHUB_STEP_SUMMARY

            if [[ -n "$SKIPPED" ]] && [[ "$SKIPPED" != "[]" ]]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo ":warning: **Deprecated check skipped for:** $(echo "$SKIPPED" | jq -r 'join(", ")')" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> Configured via repository variable \`DEPRECATED_SKIP_ADAPTERS\`" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: _detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs._detect-changes.outputs.adapters != '[]'
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJson(needs._detect-changes.outputs.adapters) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create local.properties
        run: touch local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle and Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clean Build Directories
        run: rm -rf */build build-logic/build build-logic/convention-plugins/build

      - name: Build adapter
        id: build
        timeout-minutes: 10
        run: |
          echo "📦 Building adapter: ${{ matrix.adapter }}"
          ./gradlew :adapter:${{ matrix.adapter }}:assembleProductionRelease --build-cache --no-daemon --stacktrace > build_output.log 2>&1
          BUILD_EXIT_CODE=$?

          if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "✅ Build successful"
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Build failed"
            cat build_output.log
            echo "build_status=failure" >> $GITHUB_OUTPUT
            exit $BUILD_EXIT_CODE
          fi

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.adapter }}
          path: build_output.log
          retention-days: 1

      - name: Job Summary
        if: always()
        run: |
          echo "## Build: ${{ matrix.adapter }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build.outputs.build_status }}" == "success" ]; then
            echo ":white_check_mark: Build successful" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Build failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>Build output (last 50 lines)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 build_output.log >> $GITHUB_STEP_SUMMARY || echo "No build output available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

  deprecated-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [_detect-changes, build]
    if: |
      always() &&
      needs._detect-changes.outputs.adapters_for_deprecation != '[]' &&
      needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJson(needs._detect-changes.outputs.adapters_for_deprecation) }}

    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output-${{ matrix.adapter }}
        continue-on-error: true

      - name: Check for deprecated warnings
        id: deprecated
        env:
          ADAPTER_NAME: ${{ matrix.adapter }}
        run: |
          echo "🔍 Checking for deprecated warnings in adapter: $ADAPTER_NAME"

          if [ ! -f build_output.log ]; then
            echo "⚠️ Build output not found, skipping deprecated check"
            echo "deprecated_status=skipped" >> $GITHUB_OUTPUT
            echo "has_deprecated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          ADAPTER_DEPRECATED=$(grep "is deprecated" build_output.log | grep "adapter/$ADAPTER_NAME/" || true)

          if [ -n "$ADAPTER_DEPRECATED" ]; then
            echo "$ADAPTER_DEPRECATED" > deprecated_warnings.txt

            echo "❌ Found deprecated code warnings in adapter $ADAPTER_NAME:"
            echo ""
            echo "$ADAPTER_DEPRECATED" | sed 's/^w: //' | while IFS= read -r line; do
              echo "  🚨 $line"
            done
            echo ""
            echo "🚫 Deprecated code is not allowed in adapters."
            echo "Please remove or replace all deprecated code before merging."
            echo ""
            echo "💡 To fix this:"
            echo "   1. Find the deprecated code in the files listed above"
            echo "   2. Replace it with non-deprecated alternatives"
            echo "   3. Remove any @Deprecated annotations from adapter code"
            echo "deprecated_status=failure" >> $GITHUB_OUTPUT
            echo "has_deprecated=true" >> $GITHUB_OUTPUT
          else
            if grep -q "is deprecated" build_output.log; then
              echo "ℹ️ Found deprecated warnings in dependencies, but none in adapter $ADAPTER_NAME itself"
            fi
            echo "✅ No deprecated code warnings found in adapter"
            echo "deprecated_status=success" >> $GITHUB_OUTPUT
            echo "has_deprecated=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload deprecated warnings
        if: steps.deprecated.outputs.has_deprecated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deprecated-warnings-${{ matrix.adapter }}
          path: deprecated_warnings.txt
          retention-days: 1

      - name: Fail if deprecated found
        if: steps.deprecated.outputs.has_deprecated == 'true'
        run: exit 1

      - name: Job Summary
        if: always()
        env:
          ADAPTER_NAME: ${{ matrix.adapter }}
          DEPRECATED_STATUS: ${{ steps.deprecated.outputs.deprecated_status }}
        run: |
          echo "## Deprecated Check: $ADAPTER_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$DEPRECATED_STATUS" == "success" ]; then
            echo ":white_check_mark: No deprecated code found" >> $GITHUB_STEP_SUMMARY
          elif [ "$DEPRECATED_STATUS" == "skipped" ]; then
            echo ":warning: Check skipped (build output not available)" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Found deprecated code warnings:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if [ -f deprecated_warnings.txt ]; then
              cat deprecated_warnings.txt >> $GITHUB_STEP_SUMMARY
            else
              echo "See logs for details" >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [_detect-changes, build]
    if: |
      always() &&
      needs._detect-changes.outputs.adapters != '[]' &&
      needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJson(needs._detect-changes.outputs.adapters) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create local.properties
        run: touch local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle and Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        id: tests
        timeout-minutes: 10
        run: |
          echo "🧪 Running unit tests for adapter: ${{ matrix.adapter }}"
          ./gradlew :adapter:${{ matrix.adapter }}:testProductionReleaseUnitTest --build-cache --no-daemon --stacktrace
          TEST_EXIT_CODE=$?

          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "✅ Tests passed"
            echo "test_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Tests failed"
            echo "test_status=failure" >> $GITHUB_OUTPUT
            exit $TEST_EXIT_CODE
          fi

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-${{ matrix.adapter }}
          path: |
            adapter/${{ matrix.adapter }}/build/reports/tests/
            adapter/${{ matrix.adapter }}/build/test-results/
          retention-days: 1

      - name: Job Summary
        if: always()
        run: |
          echo "## Unit Tests: ${{ matrix.adapter }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.tests.outputs.test_status }}" == "success" ]; then
            echo ":white_check_mark: All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Tests failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
