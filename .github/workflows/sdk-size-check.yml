name: SDK Size Check

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'adapter/*/build.gradle.kts'
  push:
    branches: [develop]
    paths:
      - 'adapter/*/build.gradle.kts'

concurrency:
  group: sdk-size-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Cache develop APK on each push to develop
  cache-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and cache develop APK
        run: |
          ./gradlew :app:assembleProductionDebug
          mkdir -p develop-apk
          cp app/build/outputs/apk/production/debug/*.apk develop-apk/
        env:
          ORG_GRADLE_PROJECT_uname: ${{ secrets.ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_upassword: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Save develop APK to cache
        uses: actions/cache/save@v4
        with:
          path: develop-apk
          key: sdk-size-develop-${{ github.sha }}

  # Check if we need to run (only first time per PR)
  check-if-needed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      adapter: ${{ steps.detect.outputs.adapter }}
    steps:
      - name: Check for existing size comment
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const hasComment = comments.some(c => c.body.includes('Size Impact'));
            core.setOutput('should_run', hasComment ? 'false' : 'true');
            console.log(hasComment ? '⏭️ Size check already done, skipping' : '🔍 First run, will check size');

      - name: Checkout
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed adapter
        if: steps.check.outputs.should_run == 'true'
        id: detect
        run: |
          ADAPTER=$(git diff --name-only origin/${{ github.base_ref }} | grep 'adapter/.*/build.gradle.kts' | head -1 | sed 's|adapter/||;s|/build.gradle.kts||')
          echo "adapter=$ADAPTER" >> $GITHUB_OUTPUT
          echo "📦 Changed adapter: $ADAPTER"

  # Build PR branch APK
  build-pr:
    needs: check-if-needed
    if: needs.check-if-needed.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      size: ${{ steps.size.outputs.size }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build PR APK
        run: ./gradlew :app:assembleProductionDebug
        env:
          ORG_GRADLE_PROJECT_uname: ${{ secrets.ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_upassword: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Get APK size
        id: size
        run: |
          SIZE=$(du -b app/build/outputs/apk/production/debug/*.apk | awk '{print $1}')
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "📊 PR APK size: $SIZE bytes"

  # Get develop branch APK (from cache or build)
  get-develop:
    needs: check-if-needed
    if: needs.check-if-needed.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      size: ${{ steps.size.outputs.size }}
    steps:
      - name: Restore develop APK from cache
        id: cache-develop
        uses: actions/cache/restore@v4
        with:
          path: develop-apk
          key: sdk-size-develop-
          restore-keys: sdk-size-develop-

      - name: Checkout develop (if no cache)
        if: steps.cache-develop.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          ref: develop

      - name: Set up JDK 17 (if no cache)
        if: steps.cache-develop.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (if no cache)
        if: steps.cache-develop.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build develop APK (if no cache)
        if: steps.cache-develop.outputs.cache-hit != 'true'
        run: |
          ./gradlew :app:assembleProductionDebug
          mkdir -p develop-apk
          cp app/build/outputs/apk/production/debug/*.apk develop-apk/
        env:
          ORG_GRADLE_PROJECT_uname: ${{ secrets.ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_upassword: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Get develop APK size
        id: size
        run: |
          SIZE=$(du -b develop-apk/*.apk | awk '{print $1}')
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "📊 Develop APK size: $SIZE bytes (cache hit: ${{ steps.cache-develop.outputs.cache-hit }})"

  # Compare sizes and comment on PR
  compare:
    needs: [check-if-needed, build-pr, get-develop]
    if: needs.check-if-needed.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Calculate size difference and comment
        uses: actions/github-script@v7
        with:
          script: |
            const adapter = '${{ needs.check-if-needed.outputs.adapter }}';
            const prSize = ${{ needs.build-pr.outputs.size }};
            const devSize = ${{ needs.get-develop.outputs.size }};

            const diff = prSize - devSize;
            const diffKB = (diff / 1024).toFixed(1);
            const diffMB = (diff / 1048576).toFixed(2);
            const percent = ((diff * 100) / devSize).toFixed(2);

            const prMB = (prSize / 1048576).toFixed(2);
            const devMB = (devSize / 1048576).toFixed(2);

            // Icons: green for decrease, yellow for small increase, red for large increase
            const icon = diff > 0 ? (diff > 5242880 ? '🔴' : '⚠️') : '✅';
            const sign = diff > 0 ? '+' : '';

            let alert = '';
            if (diff > 5242880 || parseFloat(percent) > 10) {
              alert = '\n\n> ⚠️ **Significant increase!** Review adapter dependencies.';
            }

            const body = `## ${icon} \`${adapter}\` Size Impact

            | develop | PR | Δ |
            |---------|-----|---|
            | ${devMB} MB | ${prMB} MB | **${sign}${diffKB} KB (${sign}${percent}%)** |
            ${alert}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

            // Also add to job summary
            await core.summary
              .addHeading(`${icon} ${adapter} Size Impact`)
              .addTable([
                [{data: 'develop', header: true}, {data: 'PR', header: true}, {data: 'Δ', header: true}],
                [devMB + ' MB', prMB + ' MB', sign + diffKB + ' KB (' + sign + percent + '%)']
              ])
              .write();
