name: SDK Size Check

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - 'adapter/*/build.gradle.kts'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.adapters }}
      adapter: ${{ steps.adapter.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changes in this commit
        uses: dorny/paths-filter@v3
        id: changes
        with:
          base: 'HEAD~1'
          filters: |
            adapters:
              - 'adapter/*/build.gradle.kts'

      - name: Detect changed adapter
        if: steps.changes.outputs.adapters == 'true'
        id: adapter
        run: |
          ADAPTER=$(git diff --name-only HEAD~1 HEAD | grep 'adapter/.*/build.gradle.kts' | head -1 | sed 's|adapter/||;s|/build.gradle.kts||')
          echo "name=$ADAPTER" >> $GITHUB_OUTPUT
          echo "📦 Changed adapter: $ADAPTER"

      - name: Report detected changes
        run: |
          echo "📊 SDK Size Check - Detected Changes:"
          echo "======================================"
          if [[ "${{ steps.changes.outputs.adapters }}" == "true" ]]; then
            echo "✅ Adapter changed: ${{ steps.adapter.outputs.name }}"
          else
            echo "ℹ️ No adapter changes detected"
          fi

  build_current_sdk:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build SDK APK for current branch
        run: ./gradlew :app:assembleProductionDebug
        env:
          ORG_GRADLE_PROJECT_uname: ${{ secrets.ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_upassword: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Calculate SDK APK size
        id: current-size
        run: |
          SIZE=$(du -b app/build/outputs/apk/production/debug/*.apk | awk '{print $1}')
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "Current branch SDK APK size: $SIZE bytes"

          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "Current branch SDK APK size: ${SIZE_MB} MB"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-sdk-apk
          retention-days: 1
          path: |
            app/build/outputs/apk/production/debug/*.apk

  build_base_sdk:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    steps:
      - name: Get base branch SDK APK from cache
        id: cache-check
        uses: actions/cache@v4
        with:
          path: cached-base-sdk-apk
          key: base-sdk-apk-${{ github.base_ref }}-${{ github.event.pull_request.base.sha }}

      - name: Checkout base branch
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.base_ref }}

      - name: Set up JDK 17
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build SDK APK for base branch
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          ./gradlew :app:assembleProductionDebug
          mkdir -p cached-base-sdk-apk
          cp app/build/outputs/apk/production/debug/*.apk cached-base-sdk-apk/
        env:
          ORG_GRADLE_PROJECT_uname: ${{ secrets.ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_upassword: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Calculate SDK APK size
        id: base-size
        run: |
          SIZE=$(du -b cached-base-sdk-apk/*.apk | awk '{print $1}')
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "Base branch SDK APK size: $SIZE bytes (cache hit: ${{ steps.cache-check.outputs.cache-hit }})"

          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "Base branch SDK APK size: ${SIZE_MB} MB"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-sdk-apk
          retention-days: 7
          path: |
            cached-base-sdk-apk/*.apk

  sdk_size_comparison:
    runs-on: ubuntu-latest
    needs: [detect-changes, build_current_sdk, build_base_sdk]
    if: always() && needs.detect-changes.outputs.has_changes == 'true'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Calculate SDK size difference
        id: size-diff
        run: |
          CURRENT_SIZE=$(du -b current-sdk-apk/*.apk | awk '{print $1}')
          BASE_SIZE=$(du -b base-sdk-apk/*.apk | awk '{print $1}')

          SIZE_DIFF=$((CURRENT_SIZE - BASE_SIZE))
          SIZE_DIFF_MB=$(echo "scale=2; $SIZE_DIFF / 1048576" | bc)
          PERCENT_CHANGE=$(echo "scale=2; ($SIZE_DIFF * 100) / $BASE_SIZE" | bc)

          echo "## 📊 SDK Size Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Adapter: \`${{ needs.detect-changes.outputs.adapter }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | Size (bytes) | Size (MB) |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Base (${{ github.base_ref }}) | $BASE_SIZE | $(echo "scale=2; $BASE_SIZE / 1048576" | bc) MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Current | $CURRENT_SIZE | $(echo "scale=2; $CURRENT_SIZE / 1048576" | bc) MB |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $SIZE_DIFF -gt 0 ]; then
            echo "**⚠️ SDK size increased by ${SIZE_DIFF_MB} MB (+${PERCENT_CHANGE}%)**" >> $GITHUB_STEP_SUMMARY
            echo "size_status=increased" >> $GITHUB_OUTPUT

            if (( $(echo "$SIZE_DIFF_MB > 5" | bc -l) )) || (( $(echo "$PERCENT_CHANGE > 10" | bc -l) )); then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ⚠️ Significant Size Increase Detected!" >> $GITHUB_STEP_SUMMARY
              echo "Please review the changes to ensure they are necessary." >> $GITHUB_STEP_SUMMARY
            fi
          elif [ $SIZE_DIFF -lt 0 ]; then
            echo "**✅ SDK size decreased by ${SIZE_DIFF_MB#-} MB (${PERCENT_CHANGE}%)**" >> $GITHUB_STEP_SUMMARY
            echo "size_status=decreased" >> $GITHUB_OUTPUT
          else
            echo "**✅ No SDK size change**" >> $GITHUB_STEP_SUMMARY
            echo "size_status=unchanged" >> $GITHUB_OUTPUT
          fi

          echo "size_diff=$SIZE_DIFF" >> $GITHUB_OUTPUT
          echo "size_diff_mb=$SIZE_DIFF_MB" >> $GITHUB_OUTPUT
          echo "percent_change=$PERCENT_CHANGE" >> $GITHUB_OUTPUT
          echo "current_size=$CURRENT_SIZE" >> $GITHUB_OUTPUT
          echo "base_size=$BASE_SIZE" >> $GITHUB_OUTPUT

      - name: Comment PR with SDK size comparison
        uses: actions/github-script@v7
        with:
          script: |
            const adapter = '${{ needs.detect-changes.outputs.adapter }}';
            const sizeDiff = '${{ steps.size-diff.outputs.size_diff }}';
            const sizeDiffMB = '${{ steps.size-diff.outputs.size_diff_mb }}';
            const percentChange = '${{ steps.size-diff.outputs.percent_change }}';
            const sizeStatus = '${{ steps.size-diff.outputs.size_status }}';
            const currentSize = '${{ steps.size-diff.outputs.current_size }}';
            const baseSize = '${{ steps.size-diff.outputs.base_size }}';

            let statusIcon = '✅';
            let statusText = 'No change';

            if (sizeStatus === 'increased') {
              statusIcon = '⚠️';
              statusText = `increased by ${sizeDiffMB} MB (+${percentChange}%)`;
            } else if (sizeStatus === 'decreased') {
              statusIcon = '✅';
              statusText = `decreased by ${Math.abs(parseFloat(sizeDiffMB))} MB (${percentChange}%)`;
            }

            const currentSizeMB = (currentSize / 1048576).toFixed(2);
            const baseSizeMB = (baseSize / 1048576).toFixed(2);

            let alertMessage = '';
            if (parseFloat(sizeDiffMB) > 5 || parseFloat(percentChange) > 10) {
              alertMessage = '\n\n### ⚠️ Significant Size Increase Detected!\nThis change introduces a notable increase in SDK size. Please ensure:\n- All new dependencies are necessary\n- Version updates are justified\n- No unintended transitive dependencies were added';
            }

            const comment = `## ${statusIcon} \`${adapter}\` Size Impact\n\nSDK size ${statusText}\n\n<details>\n<summary>📊 View detailed comparison</summary>\n\n| Metric | Value |\n|--------|-------|\n| Base size (${context.payload.pull_request.base.ref}) | ${baseSizeMB} MB |\n| Current size | ${currentSizeMB} MB |\n| Size difference | ${sizeDiff} bytes |\n| Size difference (MB) | ${sizeDiffMB} MB |\n| Percentage change | ${percentChange}% |\n\n</details>${alertMessage}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

