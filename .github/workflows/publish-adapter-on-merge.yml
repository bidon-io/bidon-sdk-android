name: Publish Adapter After Dependabot Merge

on:
  push:
    branches:
      - develop
    paths:
      - 'adapter/*/build.gradle.kts'

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Updated Adapters
    runs-on: ubuntu-latest
    outputs:
      adapters: ${{ steps.detect.outputs.adapters }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed adapters
        id: detect
        run: |
          echo "🔍 Detecting which adapters were updated..."

          # Get changed files in the last commit
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD | grep 'adapter/.*/build.gradle.kts' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No adapter build.gradle.kts files changed"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "adapters=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Extract adapter names
          ADAPTERS=""
          for file in $CHANGED_FILES; do
            # Extract adapter name from path (e.g., adapter/admob/build.gradle.kts -> admob)
            ADAPTER=$(echo "$file" | sed 's|adapter/\([^/]*\)/.*|\1|')
            if [ -n "$ADAPTER" ]; then
              if [ -z "$ADAPTERS" ]; then
                ADAPTERS="$ADAPTER"
              else
                ADAPTERS="$ADAPTERS $ADAPTER"
              fi
            fi
          done

          if [ -z "$ADAPTERS" ]; then
            echo "No adapters detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "adapters=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Convert to JSON array
          echo "$ADAPTERS" | tr ' ' '\n' > /tmp/adapters.txt
          JSON_ARRAY=$(jq -R -s -c 'split("\n")[:-1]' /tmp/adapters.txt)
          rm /tmp/adapters.txt

          echo "📦 Detected adapters: $ADAPTERS"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "adapters=$JSON_ARRAY" >> $GITHUB_OUTPUT

  publish-to-private:
    name: Publish to bidon-private
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJson(needs.detect-changes.outputs.adapters) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle and Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get adapter version
        id: version
        run: |
          VERSION=$(grep 'val adapterSdkVersion = ' adapter/${{ matrix.adapter }}/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "❌ Failed to extract adapter version for ${{ matrix.adapter }}. Exiting."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Adapter: ${{ matrix.adapter }}"
          echo "🏷️  Version: $VERSION"

      - name: Publish to bidon-private
        run: |
          echo "🚀 Publishing ${{ matrix.adapter }} to bidon-private..."
          ./gradlew :adapter:${{ matrix.adapter }}:publishAllPublicationsToBidonRepository --no-daemon
        env:
          ORG_GRADLE_PROJECT_repo: bidon-private
          ORG_GRADLE_PROJECT_uname: ${{ secrets.ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_upassword: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Slack Notify Private
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://avatars.githubusercontent.com/u/120632208?s=200&v=4
          SLACK_MESSAGE: |
            📦 Adapter: ${{ matrix.adapter }}
            🏷️  Version: ${{ steps.version.outputs.version }}
            🎯 Repository: bidon-private
            📌 Status: ${{ job.status }}
            🔗 Commit: ${{ github.sha }}
          SLACK_USERNAME: bidon-publish-bot
          SLACK_TITLE: "Adapter Published (Private)"
          MSG_MINIMAL: actions url

  publish-to-public:
    name: Publish to bidon (public)
    runs-on: ubuntu-latest
    needs: [detect-changes, publish-to-private]
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJson(needs.detect-changes.outputs.adapters) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle and Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get adapter version
        id: version
        run: |
          VERSION=$(grep 'val adapterSdkVersion = ' adapter/${{ matrix.adapter }}/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "❌ Failed to extract adapter version for ${{ matrix.adapter }}. Exiting."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Adapter: ${{ matrix.adapter }}"
          echo "🏷️  Version: $VERSION"

      - name: Publish to bidon (public)
        run: |
          echo "🚀 Publishing ${{ matrix.adapter }} to bidon (public)..."
          ./gradlew :adapter:${{ matrix.adapter }}:publishAllPublicationsToBidonRepository --no-daemon
        env:
          ORG_GRADLE_PROJECT_repo: bidon
          ORG_GRADLE_PROJECT_uname: ${{ secrets.ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_upassword: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Slack Notify Public
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://avatars.githubusercontent.com/u/120632208?s=200&v=4
          SLACK_MESSAGE: |
            📦 Adapter: ${{ matrix.adapter }}
            🏷️  Version: ${{ steps.version.outputs.version }}
            🎯 Repository: bidon (public)
            📌 Status: ${{ job.status }}
            🔗 Commit: ${{ github.sha }}
          SLACK_USERNAME: bidon-publish-bot
          SLACK_TITLE: "Adapter Published (Public)"
          MSG_MINIMAL: actions url

  summary:
    name: Publication Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, publish-to-private, publish-to-public]
    if: always() && needs.detect-changes.outputs.has_changes == 'true'

    steps:
      - name: Generate Summary
        run: |
          echo "## 📦 Adapter Publication Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Adapters published**: ${{ needs.detect-changes.outputs.adapters }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results:" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 bidon-private: ${{ needs.publish-to-private.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🌍 bidon (public): ${{ needs.publish-to-public.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
