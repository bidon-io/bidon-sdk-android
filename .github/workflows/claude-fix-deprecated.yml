name: Claude Fix Deprecated

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      pr_branch:
        required: true
        type: string
      adapters:
        required: true
        type: string
      triggering_run_id:
        required: true
        type: string

jobs:
  fix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        adapter: ${{ fromJson(inputs.adapters) }}
    env:
      ORG_GRADLE_PROJECT_uname: ${{ secrets.ARTIFACTORY_USER }}
      ORG_GRADLE_PROJECT_upassword: ${{ secrets.ARTIFACTORY_PASSWORD }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.pr_branch }}
          token: ${{ secrets.DEPENDABOT_PAT }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download deprecated warnings artifact
        uses: actions/download-artifact@v4
        with:
          name: deprecated-warnings-${{ matrix.adapter }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.triggering_run_id }}
        continue-on-error: true

      - name: Extract Release Notes URL
        id: changelog
        run: |
          CHANGELOG_FILE="adapter/${{ matrix.adapter }}/CHANGELOG.md"
          if [ -f "$CHANGELOG_FILE" ]; then
            RELEASE_NOTES_URL=$(grep -o '\[Release Notes\](https://[^)]*' "$CHANGELOG_FILE" | sed 's/\[Release Notes\](//' | head -1)
            echo "release_notes_url=$RELEASE_NOTES_URL" >> $GITHUB_OUTPUT
            echo "Release Notes URL: $RELEASE_NOTES_URL"
          else
            echo "CHANGELOG.md not found for ${{ matrix.adapter }}"
            echo "release_notes_url=" >> $GITHUB_OUTPUT
          fi

      - name: Read deprecated warnings
        id: warnings
        run: |
          if [ -f deprecated_warnings.txt ]; then
            WARNINGS=$(cat deprecated_warnings.txt | head -50)
            echo "warnings<<EOF" >> $GITHUB_OUTPUT
            echo "$WARNINGS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "warnings=" >> $GITHUB_OUTPUT
          fi

      - name: Fix with Claude
        if: steps.warnings.outputs.warnings != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.DEPENDABOT_PAT }}
          timeout_minutes: 30
          claude_args: "--model claude-sonnet-4-5-20250929 --max-turns 40 --dangerously-skip-permissions"
          prompt: |
            ## Task: Fix deprecated code in adapter/${{ matrix.adapter }}

            ### Deprecated warnings:
            ```
            ${{ steps.warnings.outputs.warnings }}
            ```

            ### Release Notes URL:
            ${{ steps.changelog.outputs.release_notes_url }}

            ### Instructions:
            1. Read the deprecated warnings above carefully
            2. If Release Notes URL is available, fetch it to find migration guide
            3. For each deprecated usage in adapter/${{ matrix.adapter }}/:
               - Find the deprecated code
               - Replace with non-deprecated alternative
               - Make sure the fix compiles and maintains same functionality
            4. Run `./gradlew ktlintFormat` to format code
            5. Commit changes with message format:
               fix(${{ matrix.adapter }}): migrate deprecated API X to Y

            ### IMPORTANT:
            - Only fix deprecated code in adapter/${{ matrix.adapter }}/ directory
            - Do not change other adapters or core SDK
            - Keep the same functionality, just update deprecated APIs
            - If unsure about migration, leave a TODO comment
            - Do NOT add "Generated with Claude Code" footer to commits
            - Do NOT add "Co-Authored-By" line to commits

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git push origin HEAD:${{ inputs.pr_branch }}
          else
            echo "No changes to push"
          fi

  add-label:
    needs: fix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Add attempted label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEPENDABOT_PAT }}
          script: |
            const label = {
              name: 'bot:deprecated-attempted',
              color: '0e8a16',
              description: 'Claude attempted to fix deprecated warnings'
            };

            // Create label if not exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name
              });
            } catch (e) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (e2) {
                console.log(`Could not create label: ${e2.message}`);
              }
            }

            // Add label to PR
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              labels: [label.name]
            });
