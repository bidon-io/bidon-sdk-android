name: Claude Code

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-code-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only run on PR comments containing @claude (not from claude bot itself)
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_uname: ${{ secrets.ARTIFACTORY_USER }}
      ORG_GRADLE_PROJECT_upassword: ${{ secrets.ARTIFACTORY_PASSWORD }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BIDON_BOT_APP_ID }}
          private-key: ${{ secrets.BIDON_BOT_PRIVATE_KEY }}

      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Security: only allow same repo branches (not forks)
            const sameRepo = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepo) {
              core.setFailed(`Refusing to auto-commit to fork: ${pr.head.repo.full_name}`);
              return;
            }

            core.setOutput('head_ref', pr.head.ref);

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY_SDK }}
          github_token: ${{ steps.app-token.outputs.token }}
          trigger_phrase: "@claude"
          allowed_bots: "bidon-dependabot[bot]"
          show_full_output: true
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --max-turns 40
            --dangerously-skip-permissions
