name: Automation Dependabot

on:
  pull_request:
    types: [opened, synchronize]
    paths: ['adapter/*/build.gradle.kts']

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    name: Update CHANGELOG
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # PAT is required to trigger CI workflows on push (GITHUB_TOKEN doesn't trigger workflows)
          token: ${{ secrets.DEPENDABOT_PAT }}
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          echo "Base branch: $BASE_REF"

          git fetch origin "$BASE_REF"
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD | grep 'adapter/.*/build.gradle.kts' || true)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update changelogs
        if: steps.changed-files.outputs.changed_files != ''
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          UPDATES_COUNT=0

          echo "## Changelog Updates" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "${{ steps.changed-files.outputs.changed_files }}" | while read -r file; do
            if [ -z "$file" ]; then
              continue
            fi

            echo "::group::Processing $file"

            ADAPTER_DIR=$(dirname "$file")
            ADAPTER_NAME=$(basename "$ADAPTER_DIR")
            CHANGELOG="$ADAPTER_DIR/CHANGELOG.md"

            if [ ! -f "$CHANGELOG" ]; then
              echo "::warning::$CHANGELOG not found, skipping"
              echo "::endgroup::"
              continue
            fi

            OLD_VERSION=$(git show "origin/$BASE_REF":"$file" | grep 'val adapterSdkVersion = ' | sed 's/.*"\([^"]*\)".*/\1/' || echo "unknown")
            NEW_VERSION=$(grep 'val adapterSdkVersion = ' "$file" | sed 's/.*"\([^"]*\)".*/\1/' || echo "unknown")

            if [ "$OLD_VERSION" = "unknown" ] || [ "$NEW_VERSION" = "unknown" ]; then
              echo "::error::Could not extract version for $ADAPTER_NAME"
              echo "::endgroup::"
              continue
            fi

            if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              echo "No version change detected for $ADAPTER_NAME"
              echo "::endgroup::"
              continue
            fi

            echo "::notice::Version change for $ADAPTER_NAME: $OLD_VERSION -> $NEW_VERSION"

            CURRENT_DATE=$(date +%Y-%m-%d)

            # Get release notes URL for the adapter
            case "$ADAPTER_NAME" in
              admob)
                RELEASE_NOTES_URL="https://developers.google.com/admob/android/rel-notes"
                ;;
              gam)
                RELEASE_NOTES_URL="https://developers.google.com/ad-manager/mobile-ads-sdk/android/rel-notes"
                ;;
              amazon)
                RELEASE_NOTES_URL="https://aps.amazon.com/aps/solutions-for-mobile-app-developers/release-notes/"
                ;;
              applovin)
                RELEASE_NOTES_URL="https://github.com/AppLovin/AppLovin-MAX-SDK-Android/releases"
                ;;
              # appsflyer)
              #   RELEASE_NOTES_URL="https://support.appsflyer.com/hc/en-us/articles/115001256006-SDK-release-notes"
              #   ;;
              bidmachine)
                RELEASE_NOTES_URL="https://github.com/bidmachine/BidMachine-Android-SDK/releases"
                ;;
              bigoads)
                RELEASE_NOTES_URL="https://www.bigossp.com/guide/sdk/android"
                ;;
              chartboost)
                RELEASE_NOTES_URL="https://developers.chartboost.com/docs/android-release-notes"
                ;;
              dtexchange)
                RELEASE_NOTES_URL="https://developer.digitalturbine.com/hc/en-us/articles/360010634298"
                ;;
              # fyber)
              #   RELEASE_NOTES_URL="https://developer.digitalturbine.com/hc/en-us/articles/360010634298"
              #   ;;
              inmobi)
                RELEASE_NOTES_URL="https://support.inmobi.com/monetize/sdk-documentation/android-guidelines/sdk-changelog/"
                ;;
              ironsource)
                RELEASE_NOTES_URL="https://developers.is.com/ironsource-mobile/android/android-sdk-release-notes/"
                ;;
              meta)
                RELEASE_NOTES_URL="https://developers.facebook.com/docs/audience-network/android/releases"
                ;;
              mintegral)
                RELEASE_NOTES_URL="https://dev.mintegral.com/doc/index.html?file=sdk-m_sdk-android&lang=en"
                ;;
              mobilefuse)
                RELEASE_NOTES_URL="https://docs.mobilefuse.com/docs/android-sdk-changelog"
                ;;
              moloco)
                RELEASE_NOTES_URL="https://docs.molocoads.com/docs/release-notes"
                ;;
              startio)
                RELEASE_NOTES_URL="https://github.com/StartApp-SDK/android-sdk/releases"
                ;;
              # taurusx)
              #   RELEASE_NOTES_URL="https://docs.taurusx.com/android/release-notes"
              #   ;;
              unityads)
                RELEASE_NOTES_URL="https://github.com/Unity-Technologies/unity-ads-android/releases"
                ;;
              vkads)
                RELEASE_NOTES_URL="https://dev.vk.com/ru/sdk/vk-ads/release-notes"
                ;;
              vungle)
                RELEASE_NOTES_URL="https://support.vungle.com/hc/en-us/articles/4408659401623"
                ;;
              yandex)
                RELEASE_NOTES_URL="https://yandex.ru/dev/mobile-ads/doc/android/release-notes.html"
                ;;
              *)
                RELEASE_NOTES_URL=""
                ;;
            esac

            # Create changelog entry
            ENTRY="## [$NEW_VERSION] - $CURRENT_DATE\n### Changed\n- Updated SDK dependency from $OLD_VERSION to $NEW_VERSION\n"

            if [ -n "$RELEASE_NOTES_URL" ]; then
              ENTRY="${ENTRY}- [View Release Notes]($RELEASE_NOTES_URL)\n"
            fi

            # Insert entry after [Unreleased] section
            awk -v entry="$ENTRY" '
              /## \[Unreleased\]/ {
                print $0
                print ""
                print entry
                next
              }
              {print}
            ' "$CHANGELOG" > "${CHANGELOG}.tmp"

            mv "${CHANGELOG}.tmp" "$CHANGELOG"

            echo "Updated $CHANGELOG"
            echo "- **$ADAPTER_NAME**: $OLD_VERSION -> $NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"

            UPDATES_COUNT=$((UPDATES_COUNT + 1))
            echo "::endgroup::"
          done

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add adapter/*/CHANGELOG.md
          git commit -m "docs: update adapter changelogs for dependency updates"
          git push
          echo "::notice::Changes committed and pushed successfully"

      - name: Job Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-changes.outputs.has_changes }}" == "true" ]; then
            echo ":white_check_mark: Changes committed and pushed" >> $GITHUB_STEP_SUMMARY
          else
            echo ":information_source: No changes to commit" >> $GITHUB_STEP_SUMMARY
          fi
