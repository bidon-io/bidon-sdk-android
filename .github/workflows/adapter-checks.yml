name: Adapter Quality Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - 'adapter/**'
  push:
    branches:
      - develop
    paths:
      - 'adapter/**'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      adapters: ${{ steps.matrix.outputs.adapters }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed adapters
        uses: dorny/paths-filter@v2
        id: changes
        with:
          list-files: json
          filters: |
            admob:
              - 'adapter/admob/**'
            amazon:
              - 'adapter/amazon/**'
            applovin:
              - 'adapter/applovin/**'
            bidmachine:
              - 'adapter/bidmachine/**'
            bigoads:
              - 'adapter/bigoads/**'
            chartboost:
              - 'adapter/chartboost/**'
            dtexchange:
              - 'adapter/dtexchange/**'
            gam:
              - 'adapter/gam/**'
            inmobi:
              - 'adapter/inmobi/**'
            ironsource:
              - 'adapter/ironsource/**'
            meta:
              - 'adapter/meta/**'
            mintegral:
              - 'adapter/mintegral/**'
            mobilefuse:
              - 'adapter/mobilefuse/**'
            unityads:
              - 'adapter/unityads/**'
            vkads:
              - 'adapter/vkads/**'
            vungle:
              - 'adapter/vungle/**'
            yandex:
              - 'adapter/yandex/**'

      - name: Generate adapter matrix
        id: matrix
        run: |
          changed_adapters=()

          if [[ "${{ steps.changes.outputs.admob }}" == "true" ]]; then changed_adapters+=("admob"); fi
          if [[ "${{ steps.changes.outputs.amazon }}" == "true" ]]; then changed_adapters+=("amazon"); fi
          if [[ "${{ steps.changes.outputs.applovin }}" == "true" ]]; then changed_adapters+=("applovin"); fi
          if [[ "${{ steps.changes.outputs.bidmachine }}" == "true" ]]; then changed_adapters+=("bidmachine"); fi
          if [[ "${{ steps.changes.outputs.bigoads }}" == "true" ]]; then changed_adapters+=("bigoads"); fi
          if [[ "${{ steps.changes.outputs.chartboost }}" == "true" ]]; then changed_adapters+=("chartboost"); fi
          if [[ "${{ steps.changes.outputs.dtexchange }}" == "true" ]]; then changed_adapters+=("dtexchange"); fi
          if [[ "${{ steps.changes.outputs.gam }}" == "true" ]]; then changed_adapters+=("gam"); fi
          if [[ "${{ steps.changes.outputs.inmobi }}" == "true" ]]; then changed_adapters+=("inmobi"); fi
          if [[ "${{ steps.changes.outputs.ironsource }}" == "true" ]]; then changed_adapters+=("ironsource"); fi
          if [[ "${{ steps.changes.outputs.meta }}" == "true" ]]; then changed_adapters+=("meta"); fi
          if [[ "${{ steps.changes.outputs.mintegral }}" == "true" ]]; then changed_adapters+=("mintegral"); fi
          if [[ "${{ steps.changes.outputs.mobilefuse }}" == "true" ]]; then changed_adapters+=("mobilefuse"); fi
          if [[ "${{ steps.changes.outputs.unityads }}" == "true" ]]; then changed_adapters+=("unityads"); fi
          if [[ "${{ steps.changes.outputs.vkads }}" == "true" ]]; then changed_adapters+=("vkads"); fi
          if [[ "${{ steps.changes.outputs.vungle }}" == "true" ]]; then changed_adapters+=("vungle"); fi
          if [[ "${{ steps.changes.outputs.yandex }}" == "true" ]]; then changed_adapters+=("yandex"); fi

          if [[ ${#changed_adapters[@]} -eq 0 ]]; then
            echo "adapters=[]" >> $GITHUB_OUTPUT
            echo "📭 No adapters changed"
          else
            # Создаем JSON массив вручную без jq
            json_array="["
            for i in "${!changed_adapters[@]}"; do
              if [[ $i -gt 0 ]]; then
                json_array+=","
              fi
              json_array+="\"${changed_adapters[$i]}\""
            done
            json_array+="]"

            echo "adapters=$json_array" >> $GITHUB_OUTPUT
            echo "📦 Changed adapters: ${changed_adapters[*]}"
          fi

  adapter-checks:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.adapters != '[]'
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJson(needs.detect-changes.outputs.adapters) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create local.properties
        run: touch local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true

      - name: Compile adapter
        id: compile
        continue-on-error: true
        run: |
          echo "🔨 Compiling adapter: ${{ matrix.adapter }}"
          ./gradlew :adapter:${{ matrix.adapter }}:compileProductionDebugKotlin --no-daemon --stacktrace > compile_output.log 2>&1
          COMPILE_EXIT_CODE=$?

          if [ $COMPILE_EXIT_CODE -eq 0 ]; then
            echo "✅ Compilation successful"
            echo "compile_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Compilation failed"
            cat compile_output.log
            echo "compile_status=failure" >> $GITHUB_OUTPUT
            exit $COMPILE_EXIT_CODE
          fi

      - name: Check for deprecated warnings
        id: deprecated
        if: always()
        continue-on-error: true
        run: |
          echo "🔍 Checking for deprecated warnings in adapter: ${{ matrix.adapter }}"

          if [ ! -f compile_output.log ]; then
            echo "⚠️ Compilation output not found, skipping deprecated check"
            echo "deprecated_status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          if grep -q "is deprecated" compile_output.log; then
            echo "❌ Found deprecated code warnings in adapter ${{ matrix.adapter }}:"
            echo ""

            grep "is deprecated" compile_output.log | sed 's/^w: //' | while IFS= read -r line; do
              echo "  🚨 $line"
            done

            echo ""
            echo "🚫 Deprecated code is not allowed in adapters."
            echo "Please remove or replace all deprecated code before merging."
            echo ""
            echo "💡 To fix this:"
            echo "   1. Find the deprecated code in the files listed above"
            echo "   2. Replace it with non-deprecated alternatives"
            echo "   3. Remove any @Deprecated annotations from adapter code"
            echo "deprecated_status=failure" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ No deprecated code warnings found"
            echo "deprecated_status=success" >> $GITHUB_OUTPUT
          fi

      - name: Build adapter
        id: build
        if: always()
        continue-on-error: true
        run: |
          echo "📦 Building adapter: ${{ matrix.adapter }}"
          ./gradlew :adapter:${{ matrix.adapter }}:assembleProductionDebug --no-daemon --stacktrace
          BUILD_EXIT_CODE=$?

          if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "✅ Build successful"
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Build failed"
            echo "build_status=failure" >> $GITHUB_OUTPUT
            exit $BUILD_EXIT_CODE
          fi

      - name: Run unit tests
        id: tests
        if: always()
        continue-on-error: true
        run: |
          echo "🧪 Running unit tests for adapter: ${{ matrix.adapter }}"
          ./gradlew :adapter:${{ matrix.adapter }}:testProductionDebugUnitTest --no-daemon --stacktrace
          TEST_EXIT_CODE=$?

          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "✅ Tests passed"
            echo "test_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Tests failed"
            echo "test_status=failure" >> $GITHUB_OUTPUT
            exit $TEST_EXIT_CODE
          fi

      - name: Report step results
        if: always()
        run: |
          echo "📊 Summary for adapter ${{ matrix.adapter }}:"
          echo "  🔨 Compile: ${{ steps.compile.outputs.compile_status || 'unknown' }}"
          echo "  🔍 Deprecated check: ${{ steps.deprecated.outputs.deprecated_status || 'unknown' }}"
          echo "  📦 Build: ${{ steps.build.outputs.build_status || 'unknown' }}"
          echo "  🧪 Tests: ${{ steps.tests.outputs.test_status || 'unknown' }}"

  adapter-checks-summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, adapter-checks]
    if: always()

    steps:
      - name: Analyze adapter check results
        run: |
          if [[ "${{ needs.detect-changes.outputs.adapters }}" == "[]" ]]; then
            echo "📭 No adapters were changed - skipping checks"
            exit 0
          fi

          echo "📊 Adapter Checks Summary"
          echo "========================"

          OVERALL_RESULT="${{ needs.adapter-checks.result }}"
          echo "Overall job result: $OVERALL_RESULT"

          if [[ "$OVERALL_RESULT" == "success" ]]; then
            echo "✅ All adapter checks completed successfully!"
            echo ""
            echo "All steps (compile, deprecated check, build, tests) passed for all changed adapters."
          elif [[ "$OVERALL_RESULT" == "skipped" ]]; then
            echo "⏭️ Adapter checks were skipped (no changes detected)"
          else
            echo "⚠️ Some adapter checks encountered issues."
            echo ""
            echo "📋 What happened:"
            echo "• All steps were executed independently using continue-on-error"
            echo "• Each step reported its individual status"
            echo "• Check the individual step logs above for detailed results"
            echo ""
            echo "🔍 To investigate:"
            echo "1. Look for step-specific status messages in the logs above"
            echo "2. Each adapter shows a summary with: Compile, Deprecated check, Build, Tests status"
            echo "3. Fix any failing steps and re-run the workflow"
            echo ""
            echo "Note: This workflow is designed to run all steps even if some fail,"
            echo "providing a complete picture of the adapter's health."
          fi
