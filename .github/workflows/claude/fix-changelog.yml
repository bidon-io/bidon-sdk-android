name: Update CHANGELOG

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      pr_branch:
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.pr_branch }}
          token: ${{ secrets.DEPENDABOT_PAT }}
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          git fetch origin develop
          CHANGED_FILES=$(git diff --name-only origin/develop...HEAD | grep 'adapter/.*/build.gradle.kts' || true)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update changelogs
        if: steps.changed-files.outputs.changed_files != ''
        run: |
          echo "## Changelog Updates" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            echo "::group::Processing $file"

            ADAPTER_DIR=$(dirname "$file")
            ADAPTER_NAME=$(basename "$ADAPTER_DIR")
            CHANGELOG="$ADAPTER_DIR/CHANGELOG.md"

            if [ ! -f "$CHANGELOG" ]; then
              echo "::warning::$CHANGELOG not found, skipping"
              echo "::endgroup::"
              continue
            fi

            OLD_SDK_VERSION=$(git show origin/develop:"$file" | grep 'val adapterSdkVersion = ' | sed 's/.*"\([^"]*\)".*/\1/' || echo "unknown")
            NEW_SDK_VERSION=$(grep 'val adapterSdkVersion = ' "$file" | sed 's/.*"\([^"]*\)".*/\1/' || echo "unknown")

            if [ "$OLD_SDK_VERSION" = "unknown" ] || [ "$NEW_SDK_VERSION" = "unknown" ]; then
              echo "::error::Could not extract version for $ADAPTER_NAME"
              echo "::endgroup::"
              continue
            fi

            if [ "$OLD_SDK_VERSION" = "$NEW_SDK_VERSION" ]; then
              echo "No version change detected for $ADAPTER_NAME"
              echo "::endgroup::"
              continue
            fi

            # Reset adapterMinor to 0 for new SDK version
            sed -i 's/val adapterMinor = [0-9]*/val adapterMinor = 0/' "$file"

            # Full adapter version: SDK version + .0 (minor resets on SDK update)
            ADAPTER_VERSION="${NEW_SDK_VERSION}.0"

            echo "::notice::Version change for $ADAPTER_NAME: $OLD_SDK_VERSION -> $NEW_SDK_VERSION (adapter version: $ADAPTER_VERSION)"

            CURRENT_DATE=$(date +%Y-%m-%d)

            # Create changelog entry
            ENTRY="## [$ADAPTER_VERSION] - $CURRENT_DATE\n### Changed\n- Updated SDK dependency from $OLD_SDK_VERSION to $NEW_SDK_VERSION\n"

            # Insert entry after [Unreleased] section
            awk -v entry="$ENTRY" '
              /## \[Unreleased\]/ {
                print $0
                print ""
                print entry
                next
              }
              {print}
            ' "$CHANGELOG" > "${CHANGELOG}.tmp"

            mv "${CHANGELOG}.tmp" "$CHANGELOG"

            echo "Updated $CHANGELOG"
            echo "- **$ADAPTER_NAME**: $OLD_SDK_VERSION -> $NEW_SDK_VERSION (v$ADAPTER_VERSION)" >> "$GITHUB_STEP_SUMMARY"

            echo "::endgroup::"
          done <<< "${{ steps.changed-files.outputs.changed_files }}"

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adapter/*/CHANGELOG.md adapter/*/build.gradle.kts
          git commit -m "chore: update adapters for dependency updates"
          git push origin HEAD:${{ inputs.pr_branch }}
          echo "::notice::Changes committed and pushed successfully"

      - name: Job Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-changes.outputs.has_changes }}" == "true" ]; then
            echo ":white_check_mark: Changes committed and pushed" >> $GITHUB_STEP_SUMMARY
          else
            echo ":information_source: No changes to commit" >> $GITHUB_STEP_SUMMARY
          fi

  add-label:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Add changelog label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEPENDABOT_PAT }}
          script: |
            const label = {
              name: 'bot:changelog-updated',
              color: '0366d6',
              description: 'CHANGELOG automatically updated'
            };

            // Create label if not exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name
              });
            } catch (e) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (e2) {
                console.log(`Could not create label: ${e2.message}`);
              }
            }

            // Add label to PR
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              labels: [label.name]
            });
