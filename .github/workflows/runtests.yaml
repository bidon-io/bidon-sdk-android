name: Android CI
on: [push,pull_request,workflow_dispatch]


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1

      - name: create local.properties
        run: touch local.properties

      - name: set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 11

      - name: set Admob Secrets
        env:
          MOBILE_ADS_APPLICATION_ID: ${{ secrets.MOBILE_ADS_APPLICATION_ID }}
        run:
          echo MOBILE_ADS_APPLICATION_ID="ca-app-pub-XXXXXXXXXXXXXXXX~XXXXXXXXXX" > ./local.properties

      # Execute unit tests
      - name: KtLint check
        run: ./gradlew ktLintCheck

      # Execute unit tests
#      - name: Unit Test
#        run: ./gradlew test
      # Execute unit tests
      - name: Unit Test
        run: ./gradlew :bidon:test

