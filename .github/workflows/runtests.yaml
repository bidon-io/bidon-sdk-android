name: Android CI
on: [push,pull_request,workflow_dispatch]

before_script:
  - touch local.properties

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1

      - name: set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 11

      # Execute unit tests
      - name: KtLint check
        run: ./gradlew ktlintcheck

      # Execute unit tests
      - name: Unit Test
        run: ./gradlew test
